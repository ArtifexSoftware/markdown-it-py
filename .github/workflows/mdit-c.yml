name: mdit-c

on:
  push:
    branches: [master]
    paths:
      - "mdit-c/**"
      - "markdown_it/**"
      - "tests/**"
      - ".github/workflows/mdit-c.yml"
  pull_request:
    paths:
      - "mdit-c/**"
      - "markdown_it/**"
      - "tests/**"
      - ".github/workflows/mdit-c.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # Regenerate all Python-derived artifacts from the current source. If
  # any committed artifact drifts, fail the job; the JSONL token oracle
  # itself is intentionally ignored by git and uploaded for the CTest
  # jobs to consume.
  # ---------------------------------------------------------------------
  oracle:
    name: regenerate oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install markdown-it-py + linkify
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[linkify]"
      - name: Regenerate regex inventory
        run: python mdit-c/scripts/regex_inventory.py
      - name: Regenerate token oracle
        run: python mdit-c/scripts/token_oracle.py --quiet
      - name: Regenerate Unicode tables
        run: python mdit-c/scripts/gen_unicode_tables.py
      - name: Regenerate Unicode case-fold table
        run: python mdit-c/scripts/gen_casefold.py
      - name: Regenerate UTF test vectors
        run: python mdit-c/scripts/gen_utf_test_vectors.py
      - name: Regenerate HTML5 entity table
        run: python mdit-c/scripts/gen_entities.py
      - name: Regenerate entity test vectors
        run: python mdit-c/scripts/gen_entity_test_vectors.py
      - name: Regenerate token JSON test vectors
        run: python mdit-c/scripts/gen_token_test_vectors.py
      - name: Regenerate URL test vectors
        run: python mdit-c/scripts/gen_url_test_vectors.py
      - name: Regenerate full TLD table
        run: python mdit-c/scripts/gen_tlds.py
      - name: Regenerate block-rule oracle (hand cases + CommonMark sweep)
        run: python mdit-c/scripts/sweep_block_oracle.py
      - name: Detect drift in any generated artifact
        run: |
          # All of the below are committed to the repo; if any diverges
          # from what the script just produced, fail the job and tell
          # the contributor exactly what to regenerate.
          paths=(
            mdit-c/docs/regex-inventory.md
            mdit-c/src/utf_tables.c
            mdit-c/src/case_fold.c
            mdit-c/tests/utf_vectors.h
            mdit-c/src/entities_table.c
            mdit-c/tests/entity_vectors.h
            mdit-c/tests/token_vectors.h
            mdit-c/tests/url_vectors.h
            mdit-c/src/linkifier_tlds_full.c
            mdit-c/tests/block_oracle.h
          )
          git status --porcelain "${paths[@]}"
          if ! git diff --quiet "${paths[@]}"; then
            echo
            echo "::error::A generated artifact drifted from the committed copy."
            echo "Run the corresponding mdit-c/scripts/*.py and commit the result."
            git --no-pager diff "${paths[@]}"
            exit 1
          fi
      - name: Upload oracle JSONL as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdit-c-oracle
          path: |
            mdit-c/tests/oracle/*.jsonl
            mdit-c/tests/oracle/manifest.json
          retention-days: 14

  # ---------------------------------------------------------------------
  # CMake build + test across the three target platforms / compilers.
  # ---------------------------------------------------------------------
  cmake-configure:
    name: cmake configure (${{ matrix.os }} / ${{ matrix.compiler }})
    needs: oracle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: ""
            cxx: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install markdown-it-py (CLI parity oracle)
        # The CLI parity test in cli/test_cli_parity.py invokes
        # ``python -m markdown_it.cli.parse`` and byte-compares against
        # ``markdown-it-c``. Install the in-tree Python package so the
        # test runs; if missing, the test self-skips with exit 0.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S mdit-c -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMDIT_BUILD_PYBIND=ON \
            -DMDIT_BUILD_FUZZ=ON \
            -DMDIT_WERROR=ON
      - name: Configure CMake (Windows / MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -S mdit-c -B build -G "Visual Studio 17 2022" -A x64 -DMDIT_BUILD_PYBIND=ON -DMDIT_BUILD_FUZZ=ON -DMDIT_WERROR=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel
      - name: Download token oracle
        uses: actions/download-artifact@v4
        with:
          name: mdit-c-oracle
          path: mdit-c/tests/oracle
      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  # ---------------------------------------------------------------------
  # ASan/UBSan job.
  # ---------------------------------------------------------------------
  sanitizers:
    name: sanitizers (Linux / clang)
    needs: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install markdown-it-py (CLI parity oracle)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Configure with ASan + UBSan
        env:
          CC: clang
        run: |
          cmake -S mdit-c -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMDIT_BUILD_PYBIND=ON \
            -DMDIT_BUILD_FUZZ=ON \
            -DMDIT_ENABLE_ASAN=ON \
            -DMDIT_ENABLE_UBSAN=ON \
            -DMDIT_WERROR=ON
      - name: Build
        run: cmake --build build-san --parallel
      - name: Download token oracle
        uses: actions/download-artifact@v4
        with:
          name: mdit-c-oracle
          path: mdit-c/tests/oracle
      - name: Test under sanitizers
        run: ctest --test-dir build-san --output-on-failure

  # ---------------------------------------------------------------------
  # Coverage-guided fuzzing of the C engine.
  #
  # Builds the `mdit-c/fuzz/` harnesses with `-fsanitize=fuzzer,address,
  # undefined` and runs each one against the seeded corpus for a short
  # budget. Real fuzzing happens out of band on oss-fuzz; this job
  # exists to (a) keep the harnesses building cleanly and (b) catch
  # any regression on the seed corpus immediately. Crashes are
  # uploaded as job artifacts for triage.
  # ---------------------------------------------------------------------
  c-fuzzers:
    name: c-fuzzers (Linux / clang + libFuzzer)
    needs: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure with libFuzzer
        env:
          CC: clang
        run: |
          cmake -S mdit-c -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMDIT_BUILD_FUZZ=ON \
            -DMDIT_FUZZ_LIBFUZZER=ON
      - name: Build fuzz harnesses
        run: |
          cmake --build build-fuzz --target \
            fuzz_parse_render fuzz_inline fuzz_token_roundtrip --parallel
      - name: Run fuzz_parse_render (30s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_parse_render \
            -max_total_time=30 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=artifacts/parse_render- \
            mdit-c/fuzz/corpus/parse_render
      - name: Run fuzz_inline (30s)
        run: |
          ./build-fuzz/fuzz/fuzz_inline \
            -max_total_time=30 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=artifacts/inline- \
            mdit-c/fuzz/corpus/inline
      - name: Run fuzz_token_roundtrip (30s)
        run: |
          ./build-fuzz/fuzz/fuzz_token_roundtrip \
            -max_total_time=30 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=artifacts/token_roundtrip- \
            mdit-c/fuzz/corpus/token_roundtrip
      - name: Upload crashes (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mdit-c-fuzz-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
